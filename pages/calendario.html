<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Care Contact — Calendário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../css/shared.css" rel="stylesheet" />
  <style>
    .form-label { font-weight: 700; font-size: 13px; color: #374151; margin-bottom: 5px; }
    .form-select, .form-control {
      border: 2px solid var(--cc-border);
      border-radius: 10px;
      font-size: 13px;
      padding: 10px 14px;
      font-family: var(--cc-font);
      transition: border-color 0.2s;
    }
    .form-select:focus, .form-control:focus {
      border-color: var(--cc-accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
    }
    .btn-confirmar-cal {
      width: 100%;
      background: var(--cc-primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      font-family: var(--cc-font);
      transition: background 0.2s, transform 0.15s;
    }
    .btn-confirmar-cal:hover { background: var(--cc-primary-dark); transform: translateY(-1px); }
    .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .cal-nav { display:flex; align-items:center; gap:8px; }
    .cal-nav button {
      width: 32px; height: 32px;
      border: 2px solid var(--cc-border);
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      color: var(--cc-primary);
      transition: all 0.15s;
    }
    .cal-nav button:hover { background: var(--cc-primary); color: white; border-color: var(--cc-primary); }
    #mesAno { font-weight: 800; font-size: 14px; color: var(--cc-primary); min-width: 100px; text-align: center; }
  </style>
</head>
<body>
<nav id="cc-navbar"></nav>

<div class="d-grid" style="grid-template-columns:300px 1fr;min-height:calc(100vh - 65px);" id="layout">
  <!-- SIDEBAR -->
  <div class="bg-white border-end p-4">
    <div class="d-flex gap-2 mb-4 flex-wrap">
      <button class="sidebar-tab active">Consultas</button>
      <button class="sidebar-tab">Perfil</button>
    </div>
    <h2 class="fw-bold mb-4" style="font-size:18px;color:var(--cc-primary);">Agendar consulta</h2>

    <div class="mb-3">
      <label class="form-label">Especialidade</label>
      <select class="form-select">
        <option>Ortodontia</option>
        <option>Odontologia</option>
        <option>Implantes</option>
        <option>Estética</option>
        <option>Profilaxia</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Doutor(a)</label>
      <select class="form-select">
        <option>Dra. Ana Santos</option>
        <option>Dr. Pedro Lima</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Local</label>
      <select class="form-select">
        <option>Clínica Care Contact</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Data</label>
      <select class="form-select" id="dataSelect">
        <option>23 de outubro de 2025</option>
        <option>24 de outubro de 2025</option>
        <option>30 de outubro de 2025</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Horário</label>
      <select class="form-select">
        <option>09:00 horas</option>
        <option>10:00 horas</option>
        <option>14:00 horas</option>
      </select>
    </div>
    <button class="btn-confirmar-cal" onclick="window.location.href='confirmar-consulta.html'">Confirmar</button>
  </div>

  <!-- MAIN -->
  <div class="p-4 p-md-5">
    <div class="cal-header">
      <h2 style="font-size:22px;font-weight:800;color:var(--cc-primary);margin:0;">Calendário</h2>
      <div class="cal-nav">
        <button id="prevMes">‹</button>
        <span id="mesAno">Out. – Nov.</span>
        <button id="nextMes">›</button>
        <button style="width:auto;padding:0 14px;font-size:12px;">Mês ▾</button>
      </div>
    </div>

    <div class="d-flex gap-3 mb-3 flex-wrap">
      <div class="legend-item"><div class="legend-dot dot-disponivel"></div>Dias Disponíveis</div>
      <div class="legend-item"><div class="legend-dot dot-indisponivel"></div>Dias Indisponíveis</div>
      <div class="legend-item"><div class="legend-dot dot-confirmada"></div>Consulta confirmada</div>
    </div>

    <div class="cal-grid">
      <div class="cal-dias-semana">
        <div class="cal-dia-nome domingo">DOM.</div>
        <div class="cal-dia-nome">SEG.</div>
        <div class="cal-dia-nome">TER.</div>
        <div class="cal-dia-nome">QUA.</div>
        <div class="cal-dia-nome">QUI.</div>
        <div class="cal-dia-nome">SEX.</div>
        <div class="cal-dia-nome">SÁB.</div>
      </div>
      <div class="cal-dias" id="calDias"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/toast.js"></script>
<script>
  renderNavbar('Calendário');

  let currentYear = 2025;
  let currentMonth = 9; // 0-indexed: 9 = outubro

  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  // Dias disponíveis (dia do mês)
  const disponiveis = [23, 24, 30];
  const confirmadas = [22];

  function renderCal() {
    const mesAnoEl = document.getElementById('mesAno');
    const nextMonth = currentMonth === 11 ? 0 : currentMonth + 1;
    mesAnoEl.textContent = `${meses[currentMonth]} – ${meses[nextMonth]}`;

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const prevDays = new Date(currentYear, currentMonth, 0).getDate();

    const container = document.getElementById('calDias');
    container.innerHTML = '';

    // Dias do mês anterior
    for (let i = firstDay - 1; i >= 0; i--) {
      const d = document.createElement('div');
      d.className = 'cal-dia outro-mes';
      d.textContent = prevDays - i;
      container.appendChild(d);
    }

    // Dias do mês atual
    for (let d = 1; d <= daysInMonth; d++) {
      const el = document.createElement('div');
      let cls = 'cal-dia';
      if (confirmadas.includes(d)) cls += ' confirmada';
      else if (disponiveis.includes(d)) cls += ' disponivel';
      else cls += ' indisponivel';
      el.className = cls;
      el.textContent = d;
      el.addEventListener('click', () => {
        container.querySelectorAll('.cal-dia').forEach(x => x.classList.remove('selecionado'));
        if (disponiveis.includes(d)) { el.classList.add('selecionado'); }
      });
      container.appendChild(el);
    }

    // Completar grid
    const total = firstDay + daysInMonth;
    const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
    for (let d = 1; d <= remaining; d++) {
      const el = document.createElement('div');
      el.className = 'cal-dia outro-mes';
      el.textContent = d;
      container.appendChild(el);
    }
  }

  document.getElementById('prevMes').addEventListener('click', () => {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderCal();
  });
  document.getElementById('nextMes').addEventListener('click', () => {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCal();
  });

  renderCal();

  function checkLayout() {
    document.getElementById('layout').style.gridTemplateColumns = window.innerWidth < 768 ? '1fr' : '300px 1fr';
  }
  checkLayout();
  window.addEventListener('resize', checkLayout);
</script>
</body>
</html>
